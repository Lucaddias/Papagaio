name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-papagaio-core:
    name: Testes do PapagaioCore (SPM)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap runtimes (Silero VAD)
        run: ./Scripts/bootstrap-runtimes.sh

      - name: swift test
        working-directory: PapagaioCore
        run: swift test

  test-app:
    name: Testes do app (Loro.xcodeproj)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap runtimes (Silero VAD)
        run: ./Scripts/bootstrap-runtimes.sh

      - name: xcodebuild test
        run: |
          xcodebuild test \
            -project Loro.xcodeproj \
            -scheme Loro \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
